{% extends 'admin_base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card premium">
	<div class="card-header">Permisos de Usuario</div>
	<div class="card-body">
		<form method="post">
			{% csrf_token %}
			<div class="row g-3">
				<div class="col-auto">
					<div class="form-check">
						<input type="checkbox" name="is_staff" id="is_staff" class="form-check-input" {% if user_obj.is_staff %}checked{% endif %}>
						<label class="form-check-label" for="is_staff">Staff</label>
					</div>
				</div>
				<div class="col-auto">
					<div class="form-check">
						<input type="checkbox" name="is_superuser" id="is_superuser" class="form-check-input" {% if user_obj.is_superuser %}checked{% endif %}>
						<label class="form-check-label" for="is_superuser">Superuser</label>
					</div>
				</div>
				<div class="col-12">
					<label class="form-label">Grupos</label>
					<select name="groups" multiple class="form-control">
						{% for g in groups %}
							<option value="{{ g.id }}" {% if g in user_obj.groups.all %}selected{% endif %}>{{ g.name }}</option>
						{% endfor %}
					</select>
				</div>
			</div>
			<div class="d-flex justify-content-end gap-2 mt-3">
				<a href="{% url 'admin_panel:admin_user_detail' user_obj.pk %}" class="btn btn-outline-secondary">Cancelar</a>
				<button class="btn btn-primary" type="submit">Guardar</button>
			</div>
		</form>
	</div>
</div>
{% endblock %}
